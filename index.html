<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TIC TAC MIND - Modern dark-themed Tic Tac Toe with an unbeatable Minimax AI.">
    <title>TIC TAC MIND 🎮⚡</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Canvas for Ambient Particles -->
    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <h1 class="logo">TIC TAC <span class="accent-cyan">MIND</span></h1>
            <p class="subtitle">The Unbeatable AI Challenge</p>
        </header>

        <!-- MAIN MENU VIEW -->
        <section id="startView" class="view-section active">
            <div class="menu-card glass-panel">
                <button id="btnPlay" class="btn btn-primary glow-cyan">PLAY GAME</button>
                <button id="btnDifficulty" class="btn btn-secondary glow-purple">DIFFICULTY: <span id="currentDiffLabel">IMPOSSIBLE</span></button>
                <button id="btnSettings" class="btn btn-secondary">SETTINGS</button>
            </div>

            <!-- Stats Footer Pill -->
            <div class="stats-pill glass-panel">
                <span>Played: <b id="statPlayed">0</b></span>
                <span class="divider">|</span>
                <span>Human Wins: <b id="statHumanWins">0</b></span>
                <span class="divider">|</span>
                <span>AI Wins: <b id="statAiWins">0</b></span>
                <span class="divider">|</span>
                <span>Draws: <b id="statDraws">0</b></span>
            </div>
        </section>

        <!-- DIFFICULTY SELECTION VIEW -->
        <section id="difficultyView" class="view-section hidden">
            <div class="menu-card glass-panel">
                <h2>SELECT AI DIFFICULTY</h2>
                <button class="btn btn-diff btn-easy" data-diff="Easy">
                    <span class="diff-title">EASY</span>
                    <span class="diff-desc">Casual play with occasional mistakes</span>
                </button>
                <button class="btn btn-diff btn-medium" data-diff="Medium">
                    <span class="diff-title">MEDIUM</span>
                    <span class="diff-desc">Tactical challenge with limited depth</span>
                </button>
                <button class="btn btn-diff btn-impossible active" data-diff="Impossible">
                    <span class="diff-title">IMPOSSIBLE</span>
                    <span class="diff-desc">Full Minimax + Alpha-Beta Pruning (Unbeatable)</span>
                </button>
                <button id="btnDiffBack" class="btn btn-muted">BACK</button>
            </div>
        </section>

        <!-- GAMEPLAY VIEW -->
        <section id="gameView" class="view-section hidden">
            <!-- HUD TOP BAR -->
            <div class="hud-bar">
                <div class="turn-card glass-panel" id="turnCard">
                    <span id="turnStatus">YOUR TURN (X)</span>
                </div>
                <div class="diff-badge glass-panel">
                    <span id="gameDiffBadge">IMPOSSIBLE</span>
                </div>
            </div>

            <!-- TIC TAC TOE BOARD -->
            <div class="board-container glass-panel">
                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
                <!-- SVG Overlay for Winning Line Animation -->
                <svg id="winningLineSvg" class="winning-line-svg">
                    <line id="winningLine" x1="0" y1="0" x2="0" y2="0" />
                </svg>
            </div>

            <!-- HUD BOTTOM ACTIONS -->
            <div class="hud-actions">
                <button id="btnUndo" class="btn btn-hud">UNDO</button>
                <button id="btnRestart" class="btn btn-hud">RESTART</button>
                <button id="btnPause" class="btn btn-hud">PAUSE</button>
            </div>
        </section>
    </div>

    <!-- MODAL OVERLAY: PAUSE MENU -->
    <div id="pauseModal" class="modal-overlay hidden">
        <div class="modal-card glass-panel glow-purple">
            <h2>GAME PAUSED</h2>
            <button id="btnResume" class="btn btn-primary">RESUME</button>
            <button id="btnPauseSettings" class="btn btn-secondary">SETTINGS</button>
            <button id="btnPauseMainMenu" class="btn btn-secondary">MAIN MENU</button>
        </div>
    </div>

    <!-- MODAL OVERLAY: SETTINGS -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-card glass-panel">
            <h2>SETTINGS</h2>
            
            <div class="setting-group">
                <label for="soundToggle">Sound Effects</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>

            <div class="setting-group">
                <label for="particlesToggle">Background Particles</label>
                <input type="checkbox" id="particlesToggle" checked>
            </div>

            <div class="setting-group">
                <button id="btnResetStats" class="btn btn-muted">RESET STATISTICS</button>
            </div>

            <button id="btnCloseSettings" class="btn btn-primary">BACK</button>
        </div>
    </div>

    <!-- MODAL OVERLAY: GAME OVER -->
    <div id="gameOverModal" class="modal-overlay hidden">
        <div class="modal-card glass-panel">
            <h2 id="gameOverTitle">VICTORY!</h2>
            <p id="gameOverSubtitle">Impossible AI Remains Undefeated</p>
            <button id="btnPlayAgain" class="btn btn-primary glow-cyan">PLAY AGAIN</button>
            <button id="btnGameOverMenu" class="btn btn-secondary">MAIN MENU</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/ai.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
